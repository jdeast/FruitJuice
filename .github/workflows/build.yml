name: Build

# Compiles the plugin and runs the unit tests on every push and pull request.
#
# The matrix is not decoration. The pom targets Java 11 bytecode, but the server
# this runs on is Java 25 and README_server_setup.md tells people to install 21,
# so "does it still work on a modern JVM" is a real question and one that has
# bitten this project's dependencies before. Building on 11 proves the target is
# honest; running the tests on 21 proves the result works where it is deployed.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ["11", "17", "21"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build and test
        run: mvn --batch-mode --no-transfer-progress verify

      # Surefire's own output is buried in the log; this surfaces a failure
      # summary on the run page itself.
      - name: Test report
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: target/surefire-reports/TEST-*.xml
          check_name: "Tests (Java ${{ matrix.java }})"
          fail_on_failure: true
          require_tests: true

      # Only from the Java 11 build, which is the one whose bytecode we ship.
      - name: Upload the plugin jar
        if: matrix.java == '11'
        uses: actions/upload-artifact@v7
        with:
          name: FruitJuice-jar
          path: target/FruitJuice-*.jar
          if-no-files-found: error
